<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 120 120" role="img" aria-labelledby="title description">
  <title id="title">DeltaVMap Selected Route</title>
  <desc id="description">A bright selected landing route crosses a faded planetary branch above the Delta-V Map wordmark.</desc>
